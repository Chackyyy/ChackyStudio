<style>
/* Layout: one sunflower panel centred on the studio's warm backdrop, carrying the logo and the maintenance notice. */
:root {
  --bg: #FBFBF9;
  --ink: #1D1D1F;
  --muted: #6E6A60;
  --yellow: #FFD43B;
  --yellow-hi: #FFE680;
  --yellow-lo: #FFC21A;
  --night: #1D1D1F;
  --day: #FFFFFF;
  --on-yellow-muted: #4E4528;
  --orb-light: #FFF4C2;
  --orb-deep: #FFB300;
  --logo-hi: #F7BE16;
  --logo-lo: #D48A00;
  --ribbon-hi: #FFE047;
  --ribbon-lo: #FFC400;
  --ribbon-deep: #E09E00;
  --amber: #E08A00;
  --backdrop-base: linear-gradient(180deg, #FDFBF3 0%, #FBFBF9 38%, #FBF8EE 100%);
  --glow-yellow: rgba(255, 205, 50, 0.36);
  --glow-amber: rgba(255, 170, 0, 0.24);
  --tile-line: rgba(120, 90, 10, 0.055);
  --panel-shadow: 0 1px 0 rgba(255, 255, 255, 0.7) inset, 0 40px 90px -40px rgba(220, 170, 0, 0.75);
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F0F10;
    --ink: #F5F5F7;
    --muted: #A1A1A6;
    --logo-hi: #FFE680;
    --logo-lo: #FFC21A;
    --ribbon-hi: #FFF2A8;
    --ribbon-lo: #FFD43B;
    --ribbon-deep: #F0AE00;
    --backdrop-base: linear-gradient(180deg, #17150F 0%, #0F0F10 40%, #0F0F10 70%, #15120B 100%);
    --glow-yellow: rgba(255, 196, 40, 0.32);
    --glow-amber: rgba(255, 150, 10, 0.28);
    --tile-line: rgba(255, 214, 110, 0.045);
    --panel-shadow: 0 1px 0 rgba(255, 255, 255, 0.5) inset, 0 40px 90px -40px rgba(255, 212, 59, 0.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F0F10;
  --ink: #F5F5F7;
  --muted: #A1A1A6;
  --logo-hi: #FFE680;
  --logo-lo: #FFC21A;
  --ribbon-hi: #FFF2A8;
  --ribbon-lo: #FFD43B;
  --ribbon-deep: #F0AE00;
  --backdrop-base: linear-gradient(180deg, #17150F 0%, #0F0F10 40%, #0F0F10 70%, #15120B 100%);
  --glow-yellow: rgba(255, 196, 40, 0.32);
  --glow-amber: rgba(255, 150, 10, 0.28);
  --tile-line: rgba(255, 214, 110, 0.045);
  --panel-shadow: 0 1px 0 rgba(255, 255, 255, 0.5) inset, 0 40px 90px -40px rgba(255, 212, 59, 0.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  line-height: 1.5;
  letter-spacing: -0.011em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}
::selection { background: var(--yellow); color: var(--night); }

.backdrop { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; background: var(--backdrop-base); }
.bg-glow { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, var(--glow-color), transparent); }
.bg-glow-1 { --glow-color: var(--glow-yellow); width: 72vmax; height: 72vmax; left: -36vmax; top: -22vmax; animation: drift-a 32s ease-in-out infinite; }
.bg-glow-2 { --glow-color: var(--glow-amber); width: 66vmax; height: 66vmax; right: -34vmax; bottom: -30vmax; animation: drift-b 38s ease-in-out infinite; }
.bg-tiles {
  position: absolute;
  inset: 0;
  background-image: linear-gradient(to right, var(--tile-line) 1px, transparent 1px), linear-gradient(to bottom, var(--tile-line) 1px, transparent 1px);
  background-size: 64px 64px;
  background-position: center top;
  -webkit-mask-image: linear-gradient(90deg, #000, rgba(0, 0, 0, 0.2) 40%, rgba(0, 0, 0, 0.2) 60%, #000);
  mask-image: linear-gradient(90deg, #000, rgba(0, 0, 0, 0.2) 40%, rgba(0, 0, 0, 0.2) 60%, #000);
}
@keyframes drift-a { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(60px, 40px) scale(1.12); } }
@keyframes drift-b { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-70px, -30px) scale(0.92); } }

.page {
  min-height: 100%;
  display: grid;
  place-items: center;
  gap: 28px;
  align-content: center;
  padding-block: 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.wordmark { display: inline-flex; align-items: center; gap: 10px; font-size: 1.12rem; letter-spacing: -0.025em; white-space: nowrap; }
.wordmark b { font-weight: 700; }
.wordmark .wm-light { font-weight: 500; color: var(--muted); }
.logo { width: 36px; height: 36px; flex: none; filter: drop-shadow(0 3px 6px rgba(200, 140, 0, 0.3)); }

.panel {
  position: relative;
  overflow: clip;
  display: grid;
  justify-items: center;
  gap: 22px;
  width: 100%;
  max-width: 640px;
  padding: clamp(36px, 7vw, 64px) clamp(24px, 6vw, 56px);
  border-radius: 36px;
  background: linear-gradient(160deg, var(--yellow-hi), var(--yellow) 45%, var(--yellow-lo));
  color: var(--night);
  text-align: center;
  box-shadow: var(--panel-shadow);
}
.panel::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.55), inset 0 -90px 120px -80px rgba(190, 115, 0, 0.35);
}
.lights { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: inherit; }
.orb { position: absolute; border-radius: 50%; filter: blur(50px); }
.orb-a { width: 380px; height: 380px; top: -180px; left: -120px; background: var(--orb-light); opacity: 0.9; animation: drift-a 18s ease-in-out infinite; }
.orb-b { width: 340px; height: 340px; bottom: -200px; right: -100px; background: var(--orb-deep); opacity: 0.5; animation: drift-b 22s ease-in-out infinite; }
.panel > :not(.lights) { position: relative; z-index: 1; }

.tool {
  display: grid;
  place-items: center;
  width: 72px;
  height: 72px;
  border-radius: 22px;
  background: var(--night);
  color: var(--yellow);
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.12) inset, 0 18px 30px -14px rgba(29, 29, 31, 0.7);
}
.tool svg { width: 34px; height: 34px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transform-origin: 70% 30%; animation: tighten 3.2s ease-in-out infinite; }
@keyframes tighten { 0%, 55%, 100% { transform: rotate(0deg); } 65% { transform: rotate(-18deg); } 75% { transform: rotate(6deg); } 85% { transform: rotate(-4deg); } }

.tag {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 7px 14px 7px 12px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--day) 55%, transparent);
  border: 1px solid color-mix(in srgb, var(--day) 70%, transparent);
  font-size: 0.8rem;
  font-weight: 600;
}
.tag .dot { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }
.tag .dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--amber); animation: ping 1.8s cubic-bezier(0, 0, .2, 1) infinite; }
@keyframes ping { 75%, 100% { transform: scale(2.8); opacity: 0; } }

h1 {
  margin: 0;
  max-width: 18ch;
  font-size: clamp(1.9rem, 1.2rem + 2.6vw, 3rem);
  font-weight: 700;
  line-height: 1.08;
  letter-spacing: -0.04em;
  text-wrap: balance;
}
.panel p.sub {
  margin: 0;
  max-width: 34ch;
  font-size: clamp(1.1rem, 1rem + 0.4vw, 1.3rem);
  font-weight: 500;
  color: var(--on-yellow-muted);
  letter-spacing: -0.015em;
}

.foot { margin: 0; font-size: 0.8rem; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
}
</style>
</head>
